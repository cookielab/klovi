name: Release - Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build assets for (e.g. 1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Whether this is a prerelease (skips Homebrew cask update)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "Version tag to build assets for"
        required: true
        type: string
      prerelease:
        description: "Whether this is a prerelease (skips Homebrew cask update)"
        required: false
        type: boolean
        default: false

jobs:
  release-meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      build_env: ${{ steps.release_meta.outputs.build_env }}
      electrobun_env: ${{ steps.release_meta.outputs.electrobun_env }}
      commit: ${{ steps.release_meta.outputs.commit }}
    steps:
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$'; then
            echo "::error::Invalid version format '$VERSION'. Expected X.Y.Z, X.Y.Z-beta.N, or X.Y.Z-rc.N"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version }}

      - name: Set release metadata
        id: release_meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if echo "$VERSION" | grep -q -- '-beta\.'; then
            BUILD_ENV="beta"
            ELECTROBUN_ENV="canary"
          elif echo "$VERSION" | grep -q -- '-rc\.'; then
            BUILD_ENV="candidate"
            ELECTROBUN_ENV="canary"
          else
            BUILD_ENV="stable"
            ELECTROBUN_ENV="stable"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_env=$BUILD_ENV" >> "$GITHUB_OUTPUT"
          echo "electrobun_env=$ELECTROBUN_ENV" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    needs: release-meta
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-meta.outputs.version }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun test

  build-macos:
    runs-on: macos-14
    needs: [release-meta, verify]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-meta.outputs.version }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~\.bun\install\cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Set version and commit in package.json
        env:
          VERSION: ${{ needs.release-meta.outputs.version }}
          COMMIT: ${{ needs.release-meta.outputs.commit }}
        run: |
          bun -e "
            const packageJson = 'apps/desktop/package.json';
            const pkg = await Bun.file(packageJson).json();
            pkg.version = process.env.VERSION;
            pkg.commit = process.env.COMMIT;
            await Bun.write(packageJson, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build Electrobun app
        shell: bash
        env:
          ELECTROBUN_ENV: ${{ needs.release-meta.outputs.electrobun_env }}
        run: bun run build -- --env="$ELECTROBUN_ENV"

      - name: Import code signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_FILE=$(mktemp /tmp/certificate.XXXXXX.p12)
          KEYCHAIN_FILE=$(mktemp /tmp/keychain.XXXXXX)
          rm -f "$KEYCHAIN_FILE"
          KEYCHAIN_FILE="${KEYCHAIN_FILE}.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_FILE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security import "$CERT_FILE" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_FILE"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security list-keychains -d user -s "$KEYCHAIN_FILE" login.keychain

          echo "KEYCHAIN_FILE=$KEYCHAIN_FILE" >> "$GITHUB_ENV"
          rm "$CERT_FILE"

      - name: Sign and notarize macOS app
        env:
          ELECTROBUN_ENV: ${{ needs.release-meta.outputs.electrobun_env }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          BUILD_DIR="apps/desktop/build/${ELECTROBUN_ENV}-macos-arm64"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "::error::Expected build output in $BUILD_DIR"
            find apps/desktop/build -maxdepth 2 -type d || true
            exit 1
          fi

          APP_DIR=$(find "$BUILD_DIR" -maxdepth 1 -type d -name "*.app" | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "::error::Could not find .app bundle in $BUILD_DIR"
            exit 1
          fi

          IDENTITY="Developer ID Application: Cookielab s.r.o. ($APPLE_TEAM_ID)"

          find "$APP_DIR" -type f \( -name "*.dylib" -o -name "*.so" \) -exec \
            codesign --force --options runtime --sign "$IDENTITY" --keychain "$KEYCHAIN_FILE" {} \;

          find "$APP_DIR" -type d -name "*.framework" -exec \
            codesign --force --options runtime --sign "$IDENTITY" --keychain "$KEYCHAIN_FILE" {} \;

          find "$APP_DIR/Contents/MacOS" -type f -perm +111 -exec \
            codesign --force --options runtime --sign "$IDENTITY" --keychain "$KEYCHAIN_FILE" {} \;

          codesign --force --options runtime --sign "$IDENTITY" --keychain "$KEYCHAIN_FILE" "$APP_DIR"

          echo "Verifying signature..."
          codesign --verify --deep --strict "$APP_DIR"

          NOTARIZE_ZIP=$(mktemp /tmp/notarize.XXXXXX.zip)
          ditto -c -k --keepParent "$APP_DIR" "$NOTARIZE_ZIP"

          echo "Submitting for notarization..."
          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          rm "$NOTARIZE_ZIP"

          echo "Stapling notarization ticket..."
          xcrun stapler staple "$APP_DIR"

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      - name: Package macOS DMG and signed updater bundle
        env:
          VERSION: ${{ needs.release-meta.outputs.version }}
          BUILD_ENV: ${{ needs.release-meta.outputs.build_env }}
          ELECTROBUN_ENV: ${{ needs.release-meta.outputs.electrobun_env }}
        run: |
          PREFIX="${BUILD_ENV}-macos-arm64"
          SOURCE_PREFIX="${ELECTROBUN_ENV}-macos-arm64"
          USER_DMG="Klovi-${VERSION}-macos-arm64.dmg"
          STAGING_DIR=$(mktemp -d /tmp/klovi-dmg.XXXXXX)
          cp -R "$APP_DIR" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create -volname "Klovi" -srcfolder "$STAGING_DIR" -ov -format ULFO "$USER_DMG"
          rm -rf "$STAGING_DIR"

          TARBALL_PATH="${BUILD_DIR}/Klovi.app.tar"
          ZSTD_PATH="apps/desktop/node_modules/electrobun/dist-macos-arm64/zig-zstd"
          if [ ! -x "$ZSTD_PATH" ]; then
            echo "::error::Expected zig-zstd at $ZSTD_PATH"
            exit 1
          fi

          tar -cf "$TARBALL_PATH" -C "$(dirname "$APP_DIR")" "$(basename "$APP_DIR")"
          "$ZSTD_PATH" compress -i "$TARBALL_PATH" -o "apps/desktop/artifacts/${PREFIX}-Klovi.app.tar.zst" --threads max --no-timing
          rm -f "$TARBALL_PATH"

          SOURCE_UPDATE_JSON="apps/desktop/artifacts/${SOURCE_PREFIX}-update.json"
          TARGET_UPDATE_JSON="apps/desktop/artifacts/${PREFIX}-update.json"
          if [ ! -f "$SOURCE_UPDATE_JSON" ]; then
            echo "::error::Expected updater metadata at $SOURCE_UPDATE_JSON"
            find apps/desktop/artifacts -maxdepth 1 -type f -print || true
            exit 1
          fi
          if [ "$SOURCE_UPDATE_JSON" != "$TARGET_UPDATE_JSON" ]; then
            cp "$SOURCE_UPDATE_JSON" "$TARGET_UPDATE_JSON"
          fi

          for source_patch in apps/desktop/artifacts/${SOURCE_PREFIX}-*.patch; do
            [ -e "$source_patch" ] || continue
            source_name=$(basename "$source_patch")
            suffix="${source_name#${SOURCE_PREFIX}-}"
            target_patch="apps/desktop/artifacts/${PREFIX}-${suffix}"
            if [ "$source_patch" != "$target_patch" ]; then
              cp "$source_patch" "$target_patch"
            fi
          done

          echo "USER_DMG=$USER_DMG" >> "$GITHUB_ENV"

      - name: Upload macOS user-facing asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-meta.outputs.version }}
        run: gh release upload "$VERSION" "$USER_DMG" --clobber

      - name: Upload macOS updater assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-meta.outputs.version }}
          BUILD_ENV: ${{ needs.release-meta.outputs.build_env }}
        run: |
          PREFIX="${BUILD_ENV}-macos-arm64"
          for file in \
            "apps/desktop/artifacts/${PREFIX}-Klovi.app.tar.zst" \
            apps/desktop/artifacts/${PREFIX}-*.patch \
            "apps/desktop/artifacts/${PREFIX}-update.json"
          do
            [ -e "$file" ] || continue
            gh release upload "$VERSION" "$file" --clobber
          done

      - name: Clean up keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_FILE:-}" ] && [ -f "$KEYCHAIN_FILE" ]; then
            security delete-keychain "$KEYCHAIN_FILE"
          fi

  build-linux:
    runs-on: ${{ matrix.runner }}
    needs: [release-meta, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            electrobun_arch: x64
            artifact_arch: amd64
          - runner: ubuntu-24.04-arm
            electrobun_arch: arm64
            artifact_arch: arm64
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-meta.outputs.version }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~\.bun\install\cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Set version and commit in package.json
        env:
          VERSION: ${{ needs.release-meta.outputs.version }}
          COMMIT: ${{ needs.release-meta.outputs.commit }}
        run: |
          bun -e "
            const packageJson = 'apps/desktop/package.json';
            const pkg = await Bun.file(packageJson).json();
            pkg.version = process.env.VERSION;
            pkg.commit = process.env.COMMIT;
            await Bun.write(packageJson, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build Electrobun app
        env:
          ELECTROBUN_ENV: ${{ needs.release-meta.outputs.electrobun_env }}
        run: bun run build -- --env="$ELECTROBUN_ENV"

      - name: Upload Linux user-facing and updater assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-meta.outputs.version }}
          BUILD_ENV: ${{ needs.release-meta.outputs.build_env }}
          ELECTROBUN_ENV: ${{ needs.release-meta.outputs.electrobun_env }}
          ELECTROBUN_ARCH: ${{ matrix.electrobun_arch }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
        run: |
          SOURCE_PREFIX="${ELECTROBUN_ENV}-linux-${ELECTROBUN_ARCH}"
          TARGET_PREFIX="${BUILD_ENV}-linux-${ELECTROBUN_ARCH}"
          SOURCE_BUILD_DIR="apps/desktop/build/${SOURCE_PREFIX}"

          INSTALLER=$(find apps/desktop/artifacts -maxdepth 1 -type f -name "${SOURCE_PREFIX}-*Setup*.tar.gz" | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "::error::Expected installer artifact for ${SOURCE_PREFIX}"
            find apps/desktop/artifacts -maxdepth 1 -type f -name "${SOURCE_PREFIX}-*" 2>/dev/null || true
            exit 1
          fi

          USER_ASSET="Klovi-${VERSION}-linux-${ARTIFACT_ARCH}.tar.gz"
          cp "$INSTALLER" "$USER_ASSET"
          gh release upload "$VERSION" "$USER_ASSET" --clobber

          FULL_BUNDLE=$(find apps/desktop/artifacts -maxdepth 1 -type f -name "${SOURCE_PREFIX}-*.tar.zst" ! -name "${SOURCE_PREFIX}-*Setup*.tar.zst" | head -1)
          if [ -z "$FULL_BUNDLE" ]; then
            echo "::error::Expected updater bundle for ${SOURCE_PREFIX}"
            find apps/desktop/artifacts -maxdepth 1 -type f -name "${SOURCE_PREFIX}-*" 2>/dev/null || true
            exit 1
          fi

          NORMALIZED_BUNDLE="apps/desktop/artifacts/${TARGET_PREFIX}-Klovi.tar.zst"
          if [ "$FULL_BUNDLE" != "$NORMALIZED_BUNDLE" ]; then
            cp "$FULL_BUNDLE" "$NORMALIZED_BUNDLE"
          fi
          gh release upload "$VERSION" "$NORMALIZED_BUNDLE" --clobber

          SOURCE_UPDATE_JSON="apps/desktop/artifacts/${SOURCE_PREFIX}-update.json"
          TARGET_UPDATE_JSON="apps/desktop/artifacts/${TARGET_PREFIX}-update.json"
          if [ ! -f "$SOURCE_UPDATE_JSON" ]; then
            echo "::error::Expected updater metadata at $SOURCE_UPDATE_JSON"
            find apps/desktop/artifacts -maxdepth 1 -type f -print || true
            exit 1
          fi
          if [ "$SOURCE_UPDATE_JSON" != "$TARGET_UPDATE_JSON" ]; then
            cp "$SOURCE_UPDATE_JSON" "$TARGET_UPDATE_JSON"
          fi
          gh release upload "$VERSION" "$TARGET_UPDATE_JSON" --clobber

          for source_patch in apps/desktop/artifacts/${SOURCE_PREFIX}-*.patch; do
            [ -e "$source_patch" ] || continue
            source_name=$(basename "$source_patch")
            suffix="${source_name#${SOURCE_PREFIX}-}"
            target_patch="apps/desktop/artifacts/${TARGET_PREFIX}-${suffix}"
            if [ "$source_patch" != "$target_patch" ]; then
              cp "$source_patch" "$target_patch"
            fi
            gh release upload "$VERSION" "$target_patch" --clobber
          done

      - name: Install nfpm
        run: |
          ARCH=$(uname -m)
          [ "$ARCH" = "aarch64" ] && ARCH="arm64"
          curl -sfL "https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_Linux_${ARCH}.tar.gz" | tar xz -C /usr/local/bin nfpm

      - name: Build .deb, .rpm, and .pkg.tar.zst packages
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-meta.outputs.version }}
          BUILD_ENV: ${{ needs.release-meta.outputs.build_env }}
          ELECTROBUN_ARCH: ${{ matrix.electrobun_arch }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
          BUILD_DIR: build/${{ needs.release-meta.outputs.electrobun_env }}-linux-${{ matrix.electrobun_arch }}
          NFPM_ARCH: ${{ matrix.artifact_arch }}
        run: |
          if [ ! -d "$BUILD_DIR" ]; then
            echo "::error::Expected build output in $BUILD_DIR"
            find build -maxdepth 2 -type d || true
            exit 1
          fi

          envsubst < packaging/linux/nfpm.yaml > /tmp/nfpm.yaml
          nfpm package -p deb -f /tmp/nfpm.yaml
          nfpm package -p rpm -f /tmp/nfpm.yaml
          nfpm package -p archlinux -f /tmp/nfpm.yaml

          DEB_FILE=$(ls klovi_*.deb)
          RPM_FILE=$(ls klovi-*.rpm)
          ARCH_FILE=$(ls klovi-*.pkg.tar.zst)

          gh release upload "$VERSION" "$DEB_FILE" --clobber
          gh release upload "$VERSION" "$RPM_FILE" --clobber
          gh release upload "$VERSION" "$ARCH_FILE" --clobber

  build-windows:
    runs-on: windows-2025
    needs: [release-meta, verify]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-meta.outputs.version }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~\.bun\install\cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Set version and commit in package.json
        shell: bash
        env:
          VERSION: ${{ needs.release-meta.outputs.version }}
          COMMIT: ${{ needs.release-meta.outputs.commit }}
        run: |
          bun -e "
            const packageJson = 'apps/desktop/package.json';
            const pkg = await Bun.file(packageJson).json();
            pkg.version = process.env.VERSION;
            pkg.commit = process.env.COMMIT;
            await Bun.write(packageJson, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build Electrobun app
        env:
          ELECTROBUN_ENV: ${{ needs.release-meta.outputs.electrobun_env }}
        run: bun run build -- --env="$ELECTROBUN_ENV"

      - name: Upload Windows user-facing and updater assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-meta.outputs.version }}
          BUILD_ENV: ${{ needs.release-meta.outputs.build_env }}
          ELECTROBUN_ENV: ${{ needs.release-meta.outputs.electrobun_env }}
        run: |
          SOURCE_PREFIX="${ELECTROBUN_ENV}-win-x64"
          TARGET_PREFIX="${BUILD_ENV}-win-x64"
          BUILD_DIR="apps/desktop/build/${SOURCE_PREFIX}"

          INSTALLER=$(find "$BUILD_DIR" -maxdepth 1 -type f -name '*Setup*.exe' | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "::error::Expected Windows installer in $BUILD_DIR"
            find apps/desktop/build -maxdepth 2 -type f -name '*.exe' 2>/dev/null || true
            exit 1
          fi

          USER_ASSET="Klovi-${VERSION}-windows-amd64.exe"
          cp "$INSTALLER" "$USER_ASSET"
          gh release upload "$VERSION" "$USER_ASSET" --clobber

          FULL_BUNDLE=$(find apps/desktop/artifacts -maxdepth 1 -type f -name "${SOURCE_PREFIX}-*.tar.zst" ! -name "${SOURCE_PREFIX}-*Setup*.tar.zst" | head -1)
          if [ -z "$FULL_BUNDLE" ]; then
            echo "::error::Expected updater bundle for ${SOURCE_PREFIX}"
            find apps/desktop/artifacts -maxdepth 1 -type f -name "${SOURCE_PREFIX}-*" 2>/dev/null || true
            exit 1
          fi

          NORMALIZED_BUNDLE="apps/desktop/artifacts/${TARGET_PREFIX}-Klovi.tar.zst"
          if [ "$FULL_BUNDLE" != "$NORMALIZED_BUNDLE" ]; then
            cp "$FULL_BUNDLE" "$NORMALIZED_BUNDLE"
          fi
          gh release upload "$VERSION" "$NORMALIZED_BUNDLE" --clobber

          SOURCE_UPDATE_JSON="apps/desktop/artifacts/${SOURCE_PREFIX}-update.json"
          TARGET_UPDATE_JSON="apps/desktop/artifacts/${TARGET_PREFIX}-update.json"
          if [ ! -f "$SOURCE_UPDATE_JSON" ]; then
            echo "::error::Expected updater metadata at $SOURCE_UPDATE_JSON"
            find apps/desktop/artifacts -maxdepth 1 -type f -print || true
            exit 1
          fi
          if [ "$SOURCE_UPDATE_JSON" != "$TARGET_UPDATE_JSON" ]; then
            cp "$SOURCE_UPDATE_JSON" "$TARGET_UPDATE_JSON"
          fi
          gh release upload "$VERSION" "$TARGET_UPDATE_JSON" --clobber

          for source_patch in apps/desktop/artifacts/${SOURCE_PREFIX}-*.patch; do
            [ -e "$source_patch" ] || continue
            source_name=$(basename "$source_patch")
            suffix="${source_name#${SOURCE_PREFIX}-}"
            target_patch="apps/desktop/artifacts/${TARGET_PREFIX}-${suffix}"
            if [ "$source_patch" != "$target_patch" ]; then
              cp "$source_patch" "$target_patch"
            fi
            gh release upload "$VERSION" "$target_patch" --clobber
          done

  update-cask:
    if: ${{ inputs.prerelease != true }}
    runs-on: ubuntu-latest
    needs: [release-meta, build-macos]
    environment: homebrew
    steps:
      - name: Download release asset and update Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release-meta.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          DMG_NAME="Klovi-${VERSION}-macos-arm64.dmg"
          curl -L -o "$DMG_NAME" \
            "https://github.com/${REPO}/releases/download/${VERSION}/${DMG_NAME}"

          SHA256=$(sha256sum "$DMG_NAME" | cut -d' ' -f1)
          BASE_URL="https://github.com/${REPO}/releases/download/${VERSION}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/cookielab/homebrew-tap.git"
          cd homebrew-tap

          rm -f Formula/klovi.rb

          mkdir -p Casks
          cat > Casks/klovi.rb << CASK
          cask "klovi" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "${BASE_URL}/${DMG_NAME}"
            name "Klovi"
            desc "Native desktop app for browsing and presenting AI coding session history"
            homepage "https://github.com/${REPO}"

            depends_on arch: :arm64

            app "Klovi.app"

            zap trash: [
              "~/Library/Application Support/io.cookielab.klovi",
              "~/Library/Preferences/io.cookielab.klovi.plist",
              "~/Library/Caches/io.cookielab.klovi",
            ]
          end
          CASK

          sed -i 's/^          //' Casks/klovi.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update klovi cask to ${VERSION}"
          git push

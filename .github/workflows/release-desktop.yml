name: Release - Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build assets for (e.g. 1.2.3)"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "Version tag to build assets for"
        required: true
        type: string

env:
  DESKTOP_BUILD_ENV: stable

jobs:
  release-meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      commit: ${{ steps.release_meta.outputs.commit }}
    steps:
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$'; then
            echo "::error::Invalid version format '$VERSION'. Expected X.Y.Z, X.Y.Z-beta.N, or X.Y.Z-rc.N"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version }}

      - name: Set release metadata
        id: release_meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    needs: release-meta
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-meta.outputs.version }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun test

  build-macos:
    runs-on: macos-14
    needs: [release-meta, verify]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-meta.outputs.version }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~\.bun\install\cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Set version and commit in package.json
        env:
          VERSION: ${{ needs.release-meta.outputs.version }}
          COMMIT: ${{ needs.release-meta.outputs.commit }}
        run: |
          bun -e "
            const packageJson = 'apps/desktop/package.json';
            const pkg = await Bun.file(packageJson).json();
            pkg.version = process.env.VERSION;
            pkg.commit = process.env.COMMIT;
            await Bun.write(packageJson, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build Electrobun app
        run: bun run build -- --env="$DESKTOP_BUILD_ENV"

      - name: Verify macOS wrapper contract
        run: |
          BUILD_DIR="apps/desktop/build/${DESKTOP_BUILD_ENV}-macos-arm64"
          APP_DIR=$(find "$BUILD_DIR" -maxdepth 1 -type d -name "*.app" | head -1)
          ZSTD_PATH="apps/desktop/node_modules/electrobun/dist-macos-arm64/zig-zstd"

          if [ -z "$APP_DIR" ]; then
            echo "::error::Could not find .app bundle in $BUILD_DIR"
            exit 1
          fi

          bun apps/desktop/scripts/verify-macos-wrapper-contract.ts "$APP_DIR" --zstd "$ZSTD_PATH"

      - name: Import code signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_FILE=$(mktemp /tmp/certificate.XXXXXX.p12)
          KEYCHAIN_FILE=$(mktemp /tmp/keychain.XXXXXX)
          rm -f "$KEYCHAIN_FILE"
          KEYCHAIN_FILE="${KEYCHAIN_FILE}.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_FILE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security import "$CERT_FILE" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_FILE"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_FILE" login.keychain

          echo "KEYCHAIN_FILE=$KEYCHAIN_FILE" >> "$GITHUB_ENV"
          rm "$CERT_FILE"

      - name: Sign and notarize macOS app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          BUILD_DIR="apps/desktop/build/${DESKTOP_BUILD_ENV}-macos-arm64"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "::error::Expected build output in $BUILD_DIR"
            find apps/desktop/build -maxdepth 2 -type d || true
            exit 1
          fi

          APP_DIR=$(find "$BUILD_DIR" -maxdepth 1 -type d -name "*.app" | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "::error::Could not find .app bundle in $BUILD_DIR"
            exit 1
          fi

          IDENTITY="Developer ID Application: Cookielab s.r.o. ($APPLE_TEAM_ID)"

          find "$APP_DIR" -type f \( -name "*.dylib" -o -name "*.so" \) -exec \
            codesign --force --options runtime --sign "$IDENTITY" --keychain "$KEYCHAIN_FILE" {} \;

          find "$APP_DIR" -type d -name "*.framework" -exec \
            codesign --force --options runtime --sign "$IDENTITY" --keychain "$KEYCHAIN_FILE" {} \;

          find "$APP_DIR/Contents/MacOS" -type f -perm +111 -exec \
            codesign --force --options runtime --sign "$IDENTITY" --keychain "$KEYCHAIN_FILE" {} \;

          codesign --force --options runtime --sign "$IDENTITY" --keychain "$KEYCHAIN_FILE" "$APP_DIR"

          echo "Verifying signature..."
          codesign --verify --deep --strict "$APP_DIR"

          NOTARIZE_ZIP=$(mktemp /tmp/notarize.XXXXXX.zip)
          ditto -c -k --keepParent "$APP_DIR" "$NOTARIZE_ZIP"

          echo "Submitting for notarization..."
          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          rm "$NOTARIZE_ZIP"

          echo "Stapling notarization ticket..."
          xcrun stapler staple "$APP_DIR"

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      - name: Package macOS DMG and signed updater bundle
        env:
          VERSION: ${{ needs.release-meta.outputs.version }}
        run: |
          PREFIX="${DESKTOP_BUILD_ENV}-macos-arm64"
          USER_DMG="Klovi-${VERSION}-macos-arm64.dmg"
          STAGING_DIR=$(mktemp -d /tmp/klovi-dmg.XXXXXX)
          cp -R "$APP_DIR" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create -volname "Klovi" -srcfolder "$STAGING_DIR" -ov -format ULFO "$USER_DMG"
          rm -rf "$STAGING_DIR"

          TARBALL_PATH="${BUILD_DIR}/Klovi.app.tar"
          ZSTD_PATH="apps/desktop/node_modules/electrobun/dist-macos-arm64/zig-zstd"
          if [ ! -x "$ZSTD_PATH" ]; then
            echo "::error::Expected zig-zstd at $ZSTD_PATH"
            exit 1
          fi

          tar -cf "$TARBALL_PATH" -C "$(dirname "$APP_DIR")" "$(basename "$APP_DIR")"
          "$ZSTD_PATH" compress -i "$TARBALL_PATH" -o "apps/desktop/artifacts/${PREFIX}-Klovi.app.tar.zst" --threads max --no-timing
          rm -f "$TARBALL_PATH"

          echo "USER_DMG=$USER_DMG" >> "$GITHUB_ENV"

      - name: Upload macOS user-facing asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-meta.outputs.version }}
        run: gh release upload "$VERSION" "$USER_DMG" --clobber

      - name: Upload macOS updater assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-meta.outputs.version }}
        run: |
          PREFIX="${DESKTOP_BUILD_ENV}-macos-arm64"
          for file in \
            "apps/desktop/artifacts/${PREFIX}-Klovi.app.tar.zst" \
            "apps/desktop/artifacts/${PREFIX}-update.json"
          do
            [ -e "$file" ] || continue
            gh release upload "$VERSION" "$file" --clobber
          done

      - name: Clean up keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_FILE:-}" ] && [ -f "$KEYCHAIN_FILE" ]; then
            security delete-keychain "$KEYCHAIN_FILE"
          fi

  build-linux:
    runs-on: ${{ matrix.runner }}
    needs: [release-meta, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            electrobun_arch: x64
            artifact_arch: amd64
          - runner: ubuntu-24.04-arm
            electrobun_arch: arm64
            artifact_arch: arm64
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-meta.outputs.version }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~\.bun\install\cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Install FUSE for appimagetool
        run: sudo apt-get update && sudo apt-get install -y libfuse2t64

      - name: Set version and commit in package.json
        env:
          VERSION: ${{ needs.release-meta.outputs.version }}
          COMMIT: ${{ needs.release-meta.outputs.commit }}
        run: |
          bun -e "
            const packageJson = 'apps/desktop/package.json';
            const pkg = await Bun.file(packageJson).json();
            pkg.version = process.env.VERSION;
            pkg.commit = process.env.COMMIT;
            await Bun.write(packageJson, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build Electrobun app
        run: bun run build -- --env="$DESKTOP_BUILD_ENV"

      - name: Package AppImage
        env:
          VERSION: ${{ needs.release-meta.outputs.version }}
          ELECTROBUN_ARCH: ${{ matrix.electrobun_arch }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
        run: |
          PREFIX="${DESKTOP_BUILD_ENV}-linux-${ELECTROBUN_ARCH}"
          UPDATER_BUNDLE="apps/desktop/artifacts/${PREFIX}-Klovi.tar.zst"

          if [ ! -f "$UPDATER_BUNDLE" ]; then
            FULL_BUNDLE=$(find apps/desktop/artifacts -maxdepth 1 -type f -name "${PREFIX}-*.tar.zst" ! -name "${PREFIX}-*Setup*.tar.zst" | head -1)
            if [ -z "$FULL_BUNDLE" ]; then
              echo "::error::Expected updater bundle for ${PREFIX}"
              find apps/desktop/artifacts -maxdepth 1 -type f -name "${PREFIX}-*" 2>/dev/null || true
              exit 1
            fi
            cp "$FULL_BUNDLE" "$UPDATER_BUNDLE"
          fi

          USER_ASSET="Klovi-${VERSION}-linux-${ARTIFACT_ARCH}.AppImage"

          bun apps/desktop/scripts/package-appimage.ts \
            --tarball "$UPDATER_BUNDLE" \
            --arch "$ELECTROBUN_ARCH" \
            --version "$VERSION" \
            --output "$USER_ASSET"

          echo "USER_ASSET=$USER_ASSET" >> "$GITHUB_ENV"
          echo "UPDATER_BUNDLE=$UPDATER_BUNDLE" >> "$GITHUB_ENV"

      - name: Upload Linux user-facing asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-meta.outputs.version }}
        run: gh release upload "$VERSION" "$USER_ASSET" --clobber

      - name: Upload Linux updater assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-meta.outputs.version }}
          ELECTROBUN_ARCH: ${{ matrix.electrobun_arch }}
        run: |
          PREFIX="${DESKTOP_BUILD_ENV}-linux-${ELECTROBUN_ARCH}"
          for file in \
            "$UPDATER_BUNDLE" \
            "apps/desktop/artifacts/${PREFIX}-update.json"
          do
            [ -e "$file" ] || continue
            gh release upload "$VERSION" "$file" --clobber
          done

  build-windows:
    runs-on: windows-2025
    needs: [release-meta, verify]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-meta.outputs.version }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~\.bun\install\cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Set version and commit in package.json
        shell: bash
        env:
          VERSION: ${{ needs.release-meta.outputs.version }}
          COMMIT: ${{ needs.release-meta.outputs.commit }}
        run: |
          bun -e "
            const packageJson = 'apps/desktop/package.json';
            const pkg = await Bun.file(packageJson).json();
            pkg.version = process.env.VERSION;
            pkg.commit = process.env.COMMIT;
            await Bun.write(packageJson, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build Electrobun app
        shell: bash
        run: bun run build -- --env="$DESKTOP_BUILD_ENV"

      - name: Upload Windows user-facing and updater assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-meta.outputs.version }}
        run: |
          PREFIX="${DESKTOP_BUILD_ENV}-win-x64"
          BUILD_DIR="apps/desktop/build/${PREFIX}"

          INSTALLER=$(find "$BUILD_DIR" -maxdepth 1 -type f -name '*Setup*.exe' | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "::error::Expected Windows installer in $BUILD_DIR"
            find apps/desktop/build -maxdepth 2 -type f -name '*.exe' 2>/dev/null || true
            exit 1
          fi

          USER_ASSET="Klovi-${VERSION}-windows-amd64.exe"
          cp "$INSTALLER" "$USER_ASSET"
          gh release upload "$VERSION" "$USER_ASSET" --clobber

          FULL_BUNDLE=$(find apps/desktop/artifacts -maxdepth 1 -type f -name "${PREFIX}-*.tar.zst" ! -name "${PREFIX}-*Setup*.tar.zst" | head -1)
          if [ -z "$FULL_BUNDLE" ]; then
            echo "::error::Expected updater bundle for ${PREFIX}"
            find apps/desktop/artifacts -maxdepth 1 -type f -name "${PREFIX}-*" 2>/dev/null || true
            exit 1
          fi

          NORMALIZED_BUNDLE="apps/desktop/artifacts/${PREFIX}-Klovi.tar.zst"
          if [ "$FULL_BUNDLE" != "$NORMALIZED_BUNDLE" ]; then
            cp "$FULL_BUNDLE" "$NORMALIZED_BUNDLE"
          fi
          gh release upload "$VERSION" "$NORMALIZED_BUNDLE" --clobber

          for file in "apps/desktop/artifacts/${PREFIX}-update.json"; do
            [ -e "$file" ] || continue
            gh release upload "$VERSION" "$file" --clobber
          done

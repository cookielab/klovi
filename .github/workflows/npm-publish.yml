name: Release - NPM Publish (Reusable + Debug)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify or pack (e.g. 1.2.3, 1.2.3-beta.1)"
        required: true
        type: string
      commit:
        description: "Commit hash to stamp for verification (defaults to HEAD)"
        required: false
        type: string
        default: ""
      dry-run:
        description: "Debug mode: pack only, do not publish"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        description: "Version to publish"
        required: true
        type: string
      allow-publish:
        description: "Internal switch for the production publish path"
        required: false
        type: boolean
        default: false
      commit:
        description: "Commit hash to stamp"
        required: false
        type: string
        default: ""
      dry-run:
        description: "Dry run (pack only, do not publish)"
        required: false
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # Production trusted publishing is initiated by release.yml via workflow_call.
      # Manual dispatch here is for dry-run/debug only unless npm is reconfigured.
      - name: Guard manual publish path
        if: inputs.dry-run == false && inputs.allow-publish != true
        run: |
          echo "::error::Manual workflow_dispatch publish is disabled."
          echo "::error::Run the Release workflow (.github/workflows/release.yml) for production trusted publishing, or rerun this workflow with dry-run enabled."
          exit 1

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      # Verification gates
      - run: bun run check
      - run: bun run typecheck
      - run: bun test

      # Build web assets and stage the npm artifact for publish or debug verification.
      - name: Stage npm artifact
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          bun run build:web
          bun run --filter @cookielab.io/klovi build
          bun apps/package/scripts/stage-npm.ts --version "$VERSION" --commit "${COMMIT:-$(git rev-parse --short HEAD)}"

      # Verify the staged artifact manifest before any pack or publish step.
      - name: Verify staged artifact manifest
        run: |
          echo "=== Staged package.json ==="
          cat apps/package/.stage/npm/package.json
          echo ""
          echo "=== Checking for workspace deps ==="
          if grep -q 'workspace:' apps/package/.stage/npm/package.json; then
            echo "ERROR: workspace:* dependencies found in staged manifest"
            exit 1
          fi
          echo "No workspace dependencies found - OK"

      # Verify the packed artifact under both Node and Bun.
      - name: Verify packed artifact (Node + Bun)
        run: bun run verify:packed-artifact

      - name: Publish to npm
        if: inputs.dry-run == false
        working-directory: apps/package/.stage/npm
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TAG_FLAG=""
          if echo "$VERSION" | grep -q -- '-'; then
            TAG_FLAG="--tag next"
          fi
          npm publish --access public $TAG_FLAG

      - name: Dry-run pack
        if: inputs.dry-run == true
        working-directory: apps/package/.stage/npm
        run: npm pack --dry-run

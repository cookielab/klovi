name: klovi
arch: "${NFPM_ARCH}"
platform: linux
version: "${VERSION}"
maintainer: "Cookielab s.r.o. <engineering@cookielab.io>"
description: "Desktop viewer for AI coding sessions"
vendor: "Cookielab s.r.o."
homepage: "https://github.com/cookielab/klovi"
license: MIT
section: devel

overrides:
  deb:
    depends:
      - libgtk-3-0
      - libnss3
      - libatk-bridge2.0-0
      - libdrm2
      - libxcomposite1
      - libxdamage1
      - libxrandr2
      - libgbm1
      - libpango-1.0-0
      - libcairo2
      - libasound2
  rpm:
    depends:
      - gtk3
      - nss
      - at-spi2-atk
      - libdrm
      - libXcomposite
      - libXdamage
      - libXrandr
      - mesa-libgbm
      - pango
      - cairo
      - alsa-lib

scripts:
  postinstall: packaging/linux/postinstall.sh
  preremove: packaging/linux/preremove.sh

contents:
  - src: "${BUILD_DIR}/"
    dst: /opt/klovi/
    type: tree

  - src: packaging/linux/klovi.desktop
    dst: /usr/share/applications/klovi.desktop

  - src: icon.iconset/icon_16x16.png
    dst: /usr/share/icons/hicolor/16x16/apps/klovi.png

  - src: icon.iconset/icon_32x32.png
    dst: /usr/share/icons/hicolor/32x32/apps/klovi.png

  - src: icon.iconset/icon_128x128.png
    dst: /usr/share/icons/hicolor/128x128/apps/klovi.png

  - src: icon.iconset/icon_256x256.png
    dst: /usr/share/icons/hicolor/256x256/apps/klovi.png

  - src: icon.iconset/icon_512x512.png
    dst: /usr/share/icons/hicolor/512x512/apps/klovi.png
